name: Futures Data Relay Incremental Sync

on:
  schedule:
    # 💡 核心：北京时间每周一至周五下午 16:46 准时自动触发（对应 UTC 时间 08:46）
    - cron: '46 8 * * 1-5'
  workflow_dispatch: # 支持网页端随时手动一键触发

jobs:
  run-relay-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl chinese_calendar ddddocr
          playwright install chromium

      - name: Run Relay Crawler
        env:
          JYKC_USER: ${{ secrets.JYKC_USER }}
          JYKC_PASS: ${{ secrets.JYKC_PASS }}
        run: |
          python daily_updater.py
