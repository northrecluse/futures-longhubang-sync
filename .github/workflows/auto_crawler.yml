name: Futures Data Crawler

on:
  schedule:
    - cron: '46 16 * * *'  # 每天下午 16:46 定时触发
  workflow_dispatch:      # 允许在 GitHub Actions 页面手动点按钮触发

permissions:
  contents: write         # 赋予读写权限，允许推送生成的 Excel 到仓库

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Python 环境（已移除会引发报错的 cache 参数）
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装项目依赖库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright ddddocr chinese_calendar

      # 4. 安装 Playwright 浏览器依赖及驱动
      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # 5. 运行 Python 爬虫脚本
      - name: Run Crawler Script
        env:
          USER_PHONE: ${{ secrets.USER_PHONE }}
          USER_PWD: ${{ secrets.USER_PWD }}
        run: |
          python daily_updater.py

      # 6. 自动将生成的 Excel 数据提交并推送到 GitHub 仓库
      - name: Commit and push generated data
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add futures_longhubang_data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync batch futures data update [skip ci]" && git push)
